<!doctype html><html lang="ru"><head><script src="/admin/performance.js?v=perf-1" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>СТАРТ · График</title><link rel="stylesheet" href="/admin/cafe.css"><link rel="stylesheet" href="/admin/ops-nav.css?v=header-status-1"><link rel="stylesheet" href="/admin/pos.css"><link rel="stylesheet" href="/admin/visual-v2.css"><link rel="stylesheet" href="/admin/schedule.css?v=1"><script defer src="/admin/ops-nav.js?v=header-status-1"></script><script defer src="/admin/print-ui.js?v=report-preview-1"></script><link rel="stylesheet" href="/admin/print-ui.css?v=report-preview-1"><script src="/admin/day-desk.js?v=report-preview-1" defer></script>
<script defer src="/admin/work-bar.js?v=cash-desk-1"></script><script defer src="/admin/device-health.js?v=header-status-1"></script><script defer src="/admin/schedule.js?v=1"></script><link rel="stylesheet" href="/admin/workspace-look.css?v=cart-fit-1"><script defer src="/admin/guest-bills.js?v=cash-desk-1"></script><link rel="stylesheet" href="/admin/guest-bills.css?v=cash-desk-1"></head><body class="theme-rental"><main><h1>График</h1><p class="muted">Пожелания видны всей команде. Выход подтверждает администратор. Зарплата считается по фактическому времени работы.</p><div class="schedule-toolbar"><button id="previous" aria-label="Предыдущая неделя">←</button><strong id="week-label"></strong><button id="next" aria-label="Следующая неделя">→</button><button id="this-week">Эта неделя</button><button id="next-week">Следующая</button></div><p id="schedule-notice" role="status" aria-live="polite"></p><div id="schedule-grid"></div></main><dialog id="schedule-editor"><form id="schedule-form"><div class="title-row"><h2 id="edit-title"></h2><button type="button" id="close-editor" aria-label="Закрыть">×</button></div><p id="approved-note"></p><label>Моё пожелание<select id="preference"><option value="want">Хочу выйти</option><option value="cannot">Не могу</option><option value="none">Пока не знаю / убрать отметку</option></select></label><div class="schedule-times"><label>С <input type="time" id="start"></label><label>До <input type="time" id="end"></label></div><label>Комментарий<input id="note" maxlength="300" placeholder="Необязательно"></label><p class="muted">Время необязательно. Для неполного дня укажите начало или окончание.</p><div class="schedule-actions"><button id="save-wish" type="button">Сохранить пожелание</button><button id="confirm-plan" type="button" class="primary">Подтвердить выход</button><button id="cancel-plan" type="button">Снять назначение</button><button id="reject-request" type="button">Оставить прежний график</button></div><p id="edit-error" role="status"></p></form></dialog></body></html>
